  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ---------- Responsive / any-iPhone layout ---------- */
    html { -webkit-text-size-adjust: 100%; }
    html, body { overflow-x: hidden; }
    body { min-height: 100vh; min-height: 100dvh; }

    /* Keep content clear of the notch / Dynamic Island, rounded corners and the home bar */
    .app-header {
      padding-top: calc(0.75rem + env(safe-area-inset-top));
      padding-bottom: 0.75rem;
      padding-left: calc(1rem + env(safe-area-inset-left));
      padding-right: calc(1rem + env(safe-area-inset-right));
    }
    .app-main {
      padding-left: calc(1rem + env(safe-area-inset-left));
      padding-right: calc(1rem + env(safe-area-inset-right));
      padding-bottom: calc(6rem + env(safe-area-inset-bottom));
    }

    /* Photo cards scale with the screen: max 320px, but never wider than the phone allows */
    .photo-card { width: min(20rem, calc(100vw - 3rem - env(safe-area-inset-left) - env(safe-area-inset-right))); }
    .photo-card-img { width: 100%; aspect-ratio: 1 / 1; }

    /* Safe text wrapping for long text / emojis / long words */
    .safe-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* Card caption clamp (explicit CSS so it works on every iOS Safari version) */
    .caption-clamp {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    /* ---------- Lightbox ---------- */
    #image-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100vh;              /* fallback */
      height: 100dvh;             /* iOS Safari: real visible height */
      z-index: 50;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      box-sizing: border-box;
    }
    #image-modal.open { display: flex; }

    #modal-image-container {
      flex: 1 1 auto;
      min-height: 0;              /* IMPORTANT: lets the flex child shrink instead of pushing content away */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
      touch-action: none;         /* we handle pinch / pan / swipe / double-tap ourselves */
    }
    #modal-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      transform-origin: center center;
      will-change: transform, opacity;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    #modal-caption-box {
      flex: 0 0 auto;
      max-height: 32vh;
      max-height: min(32dvh, 260px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Prev / next arrows (only shown on devices with a mouse; phones use swipe) */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.35); }
    .nav-arrow.hidden-arrow { visibility: hidden; }
    #nav-prev { left: 12px; }
    #nav-next { right: 12px; }
    @media (hover: hover) and (pointer: fine) {
      .nav-arrow { display: flex; }
    }

    body.modal-open { overflow: hidden; }

    /* Short screens (iPhone SE / mini): give the photo more room */
    @media (max-height: 700px) {
      #modal-caption-box { max-height: 24dvh; }
    }
    /* Landscape phones: very little height, keep the photo as big as possible */
    @media (orientation: landscape) and (max-height: 500px) {
      #modal-caption-box { max-height: 28dvh; }
      #modal-image-container { margin: 2px 0; }
    }

    /* ---------- Journal (cute chat-style notes) ---------- */
    .journal-hearts { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .journal-hearts span { position: absolute; bottom: -40px; opacity: 0; animation: floatHeart linear infinite; }
    @keyframes floatHeart {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: .35; }
      50%  { transform: translateY(-55vh) translateX(14px) rotate(10deg); }
      90%  { opacity: .25; }
      100% { transform: translateY(-115vh) translateX(-10px) rotate(-8deg); opacity: 0; }
    }

    .who-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px; border-radius: 16px; border: 2px solid #fecdd3;
      background: #fff; color: #64748b; font-weight: 700; font-size: 13px;
      transition: all .15s ease;
    }
    .who-btn:active { transform: scale(.96); }
    .who-btn.sel-kero { background: #f43f5e; border-color: #f43f5e; color: #fff; box-shadow: 0 4px 10px rgba(244,63,94,.3); }
    .who-btn.sel-tota { background: #a78bfa; border-color: #a78bfa; color: #fff; box-shadow: 0 4px 10px rgba(167,139,250,.35); }

    .mood-btn {
      width: 44px; height: 44px; border-radius: 9999px; background: #fff;
      border: 2px solid transparent; font-size: 22px;
      display: flex; align-items: center; justify-content: center;

    .mood-btn:active { transform: scale(.92); }
    .mood-btn.sel { border-color: #fb7185; background: #ffe4e6; transform: scale(1.12); }

    .note-row { display: flex; }
    .note-row.right { justify-content: flex-end; }
    .note-bubble {
      max-width: 86%; min-width: 0; padding: 12px 14px; border-radius: 22px;
      box-shadow: 0 2px 8px rgba(244,63,94,.08);
    }
    .note-kero  { background: linear-gradient(135deg, #ffe4e6, #fecdd3); border-bottom-right-radius: 6px; }
    .note-tota  { background: linear-gradient(135deg, #ede9fe, #ddd6fe); border-bottom-left-radius: 6px; }
    .note-other { background: linear-gradient(135deg, #ffedd5, #fed7aa); border-bottom-left-radius: 6px; }
    .note-pop { animation: notePop .4s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes notePop {
      from { opacity: 0; transform: scale(.85) translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .heart-btn {
      display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1;
      padding: 5px 9px; border-radius: 9999px; background: rgba(255,255,255,.7);
      transition: transform .15s ease, background .15s ease;
    }
    .heart-btn:active { transform: scale(1.3); }
    .heart-btn.liked { background: rgba(255,255,255,.95); }

    @media (prefers-reduced-motion: reduce) {
      .journal-hearts { display: none; }
      .note-pop { animation: none; }
    }
  </style>
</head>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBkZws6uuVSvWnqV0WgvliL1DC5HwKgk4E",
      authDomain: "keroandtota-f0393.firebaseapp.com",
      projectId: "keroandtota-f0393",
      storageBucket: "keroandtota-f0393.firebasestorage.app",
      messagingSenderId: "664802885467",
      appId: "1:664802885467:web:c48bf52856f63ccf18a47e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsymevTTHmE3NpHr26ZIWuuDQQdvzDB84_aE14ispLQjAYK8b_ciLnlQIekBGFAi9SZQ/exec';

    // Max size of the copy stored in Firestore (documents are limited to 1 MiB).
    const MAX_DIMENSION = 1280;
    const JPEG_QUALITY = 0.8;

    let selectedFileBase64 = null;   // original file, sent to Drive
    let selectedFileMime = null;
    let selectedFileName = null;
    let selectedCompressedDataUrl = null; // small copy, stored in Firestore
    let isZoomed = false;

    let photos = [];
    let journal = [];
    let currentPhotoId = null;       // id of the photo shown in the lightbox

    // Escape user text before putting it into HTML (emojis are fine, but < > & " break the markup)
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Shrink the image so the Firestore document stays well under the 1 MiB limit
    function compressImage(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          const scale = Math.min(1, MAX_DIMENSION / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    // ---------- Zoom state & gestures (pinch, pan, double-tap, swipe) ----------
    let zScale = 1, zX = 0, zY = 0;
    const MIN_SCALE = 1, MAX_SCALE = 5, DOUBLE_TAP_SCALE = 2.5;
    const SWIPE_THRESHOLD = 50; // px a finger must travel horizontally to change photo

    const clampScale = (s) => Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));

    function applyTransform(animate) {
      const img = document.getElementById('modal-image');
      img.style.transition = animate ? 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)' : 'none';
      img.style.transform = `translate(${zX}px, ${zY}px) scale(${zScale})`;
      isZoomed = zScale > 1.01;
      document.getElementById('zoom-icon').className = isZoomed ? 'fas fa-search-minus' : 'fas fa-search-plus';
    }

    function clampPan() {
      const img = document.getElementById('modal-image');
      const cont = document.getElementById('modal-image-container');
      const maxX = Math.max(0, (img.offsetWidth * zScale - cont.clientWidth) / 2);
      const maxY = Math.max(0, (img.offsetHeight * zScale - cont.clientHeight) / 2);
      zX = Math.min(maxX, Math.max(-maxX, zX));
      zY = Math.min(maxY, Math.max(-maxY, zY));
    }

    function containerCenter() {
      const r = document.getElementById('modal-image-container').getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    // Zoom to newScale keeping the point (px, py) (screen coords) under the finger
    function zoomAt(newScale, px, py, animate) {
      const c = containerCenter();
      newScale = clampScale(newScale);
      const qx = (px - c.x - zX) / zScale;
      const qy = (py - c.y - zY) / zScale;
      zScale = newScale;
      zX = px - c.x - qx * newScale;
      zY = py - c.y - qy * newScale;
      if (zScale <= 1.001) { zScale = 1; zX = 0; zY = 0; }
      clampPan();
      applyTransform(animate);
    }

    function resetZoom(animate) {
      zScale = 1; zX = 0; zY = 0;
      const img = document.getElementById('modal-image');
      img.style.opacity = '1';
      applyTransform(animate);
    }

    // ---------- Previous / next photo ----------
    function currentPhotoIndex() {
      return photos.findIndex(p => Number(p.id) === Number(currentPhotoId));
    }

    // direction: +1 = coming from the right (next), -1 = coming from the left (previous), 0 = no animation
    function showPhoto(photo, direction) {
      if (!photo) return;
      currentPhotoId = photo.id;

      const img = document.getElementById('modal-image');
      document.getElementById('modal-caption').textContent = photo.caption || '';
      document.getElementById('modal-date').textContent = photo.date || '';
      img.src = photo.imageData;
      document.getElementById('modal-caption-box').scrollTo(0, 0);

      updateNavUi();

      zScale = 1; zX = 0; zY = 0;
      isZoomed = false;
      document.getElementById('zoom-icon').className = 'fas fa-search-plus';

      if (direction) {
        // start off to the side + transparent, then slide in
        img.style.transition = 'none';
        img.style.opacity = '0';
        img.style.transform = `translate(${direction * 60}px, 0px) scale(1)`;
        void img.offsetWidth; // force reflow so the starting state is applied
        img.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease';
        img.style.opacity = '1';
        img.style.transform = 'translate(0px, 0px) scale(1)';
      } else {
        img.style.transition = 'none';
        img.style.opacity = '1';
        img.style.transform = 'translate(0px, 0px) scale(1)';
      }
    }

    function updateNavUi() {
      const idx = currentPhotoIndex();
      const total = photos.length;
      document.getElementById('modal-counter').textContent = idx >= 0 ? `${idx + 1} / ${total}` : '';
      document.getElementById('nav-prev').classList.toggle('hidden-arrow', idx <= 0);
      document.getElementById('nav-next').classList.toggle('hidden-arrow', idx < 0 || idx >= total - 1);
    }

    // step: +1 = next photo, -1 = previous photo. Returns true if the photo changed.
    function navigatePhoto(step) {
      const idx = currentPhotoIndex();
      if (idx < 0) return false;
      const target = idx + step;
      if (target < 0 || target >= photos.length) return false;
      showPhoto(photos[target], step);
      return true;
    }

    function setupZoomGestures() {
      const cont = document.getElementById('modal-image-container');
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-image');

      let mode = null;                 // 'pan' | 'pinch' | null
      let startDist = 0, startScale = 1, startX = 0, startY = 0, startMid = { x: 0, y: 0 };
      let panTouch = { x: 0, y: 0 }, panStartX = 0, panStartY = 0, moved = false;
      let lastTap = 0, lastTapPos = { x: 0, y: 0 };
      let gestureWasPinch = false;     // true if this gesture involved two fingers -> never a swipe

      const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

      function beginPan(t) {
        mode = 'pan';
        panTouch = { x: t.clientX, y: t.clientY };
        panStartX = zX; panStartY = zY;
      }

      cont.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          mode = 'pinch';
          gestureWasPinch = true;
          startDist = dist(e.touches[0], e.touches[1]);
          startScale = zScale; startX = zX; startY = zY;
          startMid = mid(e.touches[0], e.touches[1]);
          moved = true; // a pinch is never a tap
        } else if (e.touches.length === 1) {
          gestureWasPinch = false;
          beginPan(e.touches[0]);
          moved = false;
        }
      }, { passive: false });

      cont.addEventListener('touchmove', (e) => {
        if (mode === 'pinch' && e.touches.length === 2) {
          e.preventDefault();
          const m = mid(e.touches[0], e.touches[1]);
          const ns = clampScale(startScale * dist(e.touches[0], e.touches[1]) / startDist);
          const c = containerCenter();
          const qx = (startMid.x - c.x - startX) / startScale;
          const qy = (startMid.y - c.y - startY) / startScale;
          zScale = ns;
          zX = m.x - c.x - qx * ns;
          zY = m.y - c.y - qy * ns;
          clampPan();
          applyTransform(false);
        } else if (mode === 'pan' && e.touches.length === 1) {
          e.preventDefault();
          const t = e.touches[0];
          const dx = t.clientX - panTouch.x;
          const dy = t.clientY - panTouch.y;
          if (Math.hypot(dx, dy) > 8) moved = true;
          if (zScale > 1) {
            // zoomed in: move the image around
            zX = panStartX + dx;
            zY = panStartY + dy;
            clampPan();
            applyTransform(false);
          } else if (!gestureWasPinch && moved) {
            // not zoomed: image follows the finger horizontally (swipe preview)
            modalImg.style.transition = 'none';
            modalImg.style.transform = `translate(${dx * 0.6}px, 0px) scale(1)`;
          }
        }
      }, { passive: false });

      cont.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
          const t = e.changedTouches[0];
          let swiped = false;

          if (mode === 'pan' && !moved) {
            const now = Date.now();
            if (now - lastTap < 300 && Math.hypot(t.clientX - lastTapPos.x, t.clientY - lastTapPos.y) < 40) {
              // DOUBLE TAP
              e.preventDefault();
              lastTap = 0;
              if (zScale > 1.01) resetZoom(true);
              else zoomAt(DOUBLE_TAP_SCALE, t.clientX, t.clientY, true);
            } else {
              lastTap = now;
              lastTapPos = { x: t.clientX, y: t.clientY };
            }
          } else if (mode === 'pan' && moved && zScale <= 1.01 && !gestureWasPinch) {
            // SWIPE LEFT / RIGHT to change photo
            const dx = t.clientX - panTouch.x;
            const dy = t.clientY - panTouch.y;
            if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5) {
              swiped = navigatePhoto(dx < 0 ? 1 : -1); // swipe left -> next, swipe right -> previous
            }
          }

          if (!swiped && zScale < 1.01) resetZoom(true); // snap back if no photo change happened
          mode = null;
        } else if (e.touches.length === 1) {
          // one finger lifted after a pinch -> continue as pan with the remaining finger
          beginPan(e.touches[0]);
          moved = true;
        }
      }, { passive: false });

      cont.addEventListener('touchcancel', () => {
        mode = null;
        if (zScale < 1.01) resetZoom(true);
      });

      // Stop iOS Safari from zooming the whole page while the lightbox is open
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
        modal.addEventListener(ev, (e) => e.preventDefault())
      );

      // Desktop: double-click and mouse wheel
      cont.addEventListener('dblclick', (e) => {
        if (zScale > 1.01) resetZoom(true);
        else zoomAt(DOUBLE_TAP_SCALE, e.clientX, e.clientY, true);
      });
      cont.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomAt(zScale * (e.deltaY < 0 ? 1.15 : 0.87), e.clientX, e.clientY, false);
      }, { passive: false });

      window.addEventListener('resize', () => resetZoom(false));
    }

    document.addEventListener('DOMContentLoaded', () => {
      setupZoomGestures();
      document.getElementById('modal-image').setAttribute('draggable', 'false');

      document.addEventListener('keydown', (e) => {
        const open = document.getElementById('image-modal').classList.contains('open');
        if (e.key === 'Escape') closeModal();
        else if (open && e.key === 'ArrowRight') navigatePhoto(1);
        else if (open && e.key === 'ArrowLeft') navigatePhoto(-1);
      });
    });

    db.collection('photos').orderBy('id', 'desc').onSnapshot(snapshot => {
      photos = snapshot.docs.map(doc => doc.data());
      renderPhotos();
      // keep the counter / arrows correct if photos change while the lightbox is open
      if (document.getElementById('image-modal').classList.contains('open')) updateNavUi();
    }, err => console.error('photos listener error', err));

    db.collection('journal').orderBy('id', 'desc').onSnapshot(snapshot => {
      journal = snapshot.docs.map(doc => doc.data());
      renderJournal();
    }, err => console.error('journal listener error', err));

    function switchScreen(screen) {
      document.getElementById('screen-photos').classList.toggle('hidden', screen !== 'photos');
      document.getElementById('screen-journal').classList.toggle('hidden', screen !== 'journal');

      document.getElementById('screen-photos-btn').className = screen === 'photos'
        ? 'flex-1 py-2.5 rounded-lg text-xs font-bold transition text-rose-600 bg-white shadow-sm'
        : 'flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-rose-600';

      document.getElementById('screen-journal-btn').className = screen === 'journal'
        ? 'flex-1 py-2.5 rounded-lg text-xs font-bold transition text-rose-600 bg-white shadow-sm'
        : 'flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-rose-600';
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedFileName = file.name;
      selectedFileMime = file.type;
      const reader = new FileReader();
      reader.onload = async function (e) {
        selectedFileBase64 = e.target.result.split(',')[1];
        selectedCompressedDataUrl = await compressImage(e.target.result);

        document.getElementById('image-preview').src = selectedCompressedDataUrl;
        document.getElementById('image-preview-container').classList.remove('hidden');
        document.getElementById('select-photo-btn').classList.add('hidden');

        const uploadBtn = document.getElementById('upload-drive-btn');
        uploadBtn.disabled = false;
        uploadBtn.className = "w-full bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-semibold py-3 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-2 cursor-pointer";
        document.getElementById('upload-btn-text').innerText = "Upload";
      };
      reader.readAsDataURL(file);
    }

    function clearSelectedFile() {
      selectedFileBase64 = null;
      selectedCompressedDataUrl = null;
      document.getElementById('photo-file-input').value = '';
      document.getElementById('image-preview-container').classList.add('hidden');
      document.getElementById('select-photo-btn').classList.remove('hidden');

      const uploadBtn = document.getElementById('upload-drive-btn');
      uploadBtn.disabled = true;
      uploadBtn.className = "w-full bg-rose-300 text-white font-semibold py-3 rounded-xl text-xs shadow-sm transition flex items-center justify-center gap-2 cursor-not-allowed";
      document.getElementById('upload-btn-text').innerText = "Select an image first";
    }

    async function uploadMemory() {
      const caption = document.getElementById('photo-caption').value.trim();
      if (!selectedFileBase64 || !selectedCompressedDataUrl) return;

      const btnText = document.getElementById('upload-btn-text');
      btnText.innerText = "Uploading...";

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: selectedFileBase64,
            mimeType: selectedFileMime,
            filename: selectedFileName,
            caption: caption || 'Our memory'
          })
        });

        const newPhoto = {
          id: Date.now(),
          imageData: selectedCompressedDataUrl,
          caption: caption || 'Our memory ❤',
          date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        };

        await db.collection('photos').doc(newPhoto.id.toString()).set(newPhoto);

        document.getElementById('photo-caption').value = '';
        clearSelectedFile();
        alert('Successfully uploaded ❤');
      } catch (err) {
        console.error(err);
        alert('Error uploading. Please check your internet connection.');
        btnText.innerText = "Upload";
      }
    }

    // ---------- Journal: author, mood, hearts ----------
    const JOURNAL_AUTHOR_KEY = 'journalAuthor';
    const JOURNAL_LIKED_KEY = 'journalLikedNotes';
    let journalAuthor = null;          // 'Kero' | 'Tota' (remembered on this phone)
    let journalMood = null;
    let journalLiked = new Set();      // ids of notes this phone has hearted
    let renderedJournalIds = new Set();
    let journalFirstRender = true;

    function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

    function initJournalUi() {
      const saved = storageGet(JOURNAL_AUTHOR_KEY);
      if (saved === 'Kero' || saved === 'Tota') journalAuthor = saved;
      try {
        const likedRaw = storageGet(JOURNAL_LIKED_KEY);
        if (likedRaw) journalLiked = new Set(JSON.parse(likedRaw).map(String));
      } catch (e) {
        journalLiked = new Set();
      }
      updateAuthorButtons();
      updateMoodButtons();
      renderJournal();
    }
    document.addEventListener('DOMContentLoaded', initJournalUi);

    function updateAuthorButtons() {
      document.getElementById('who-kero').classList.toggle('sel-kero', journalAuthor === 'Kero');
      document.getElementById('who-tota').classList.toggle('sel-tota', journalAuthor === 'Tota');
    }

    function selectAuthor(name) {
      journalAuthor = name;
      storageSet(JOURNAL_AUTHOR_KEY, name);
      updateAuthorButtons();
    }

    function updateMoodButtons() {
      document.querySelectorAll('.mood-btn').forEach(b => {
        b.classList.toggle('sel', b.dataset.mood === journalMood);
      });
    }

    function selectMood(mood) {
      journalMood = (journalMood === mood) ? null : mood; // tap again to unselect
      updateMoodButtons();
    }

    function authorKind(name) {
      const n = String(name || '').toLowerCase();
      const k = n.includes('kero');
      const t = n.includes('tota');
      if (k && !t) return 'kero';
      if (t && !k) return 'tota';
      return 'other';
    }

    // "Today · 1:19 AM", "Yesterday · 9:40 PM", or "Oct 29, 2026 · 6:05 PM"
    function formatNoteTime(id, fallbackDate) {
      const d = new Date(Number(id));
      if (isNaN(d.getTime())) return fallbackDate || '';
      const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      const diffDays = Math.round((startOfDay(new Date()) - startOfDay(d)) / 86400000);
      if (diffDays === 0) return 'Today · ' + time;
      if (diffDays === 1) return 'Yesterday · ' + time;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + time;
    }

    async function toggleHeart(id) {
      const key = String(id);
      const wasLiked = journalLiked.has(key);

      // update the screen right away
      if (wasLiked) journalLiked.delete(key); else journalLiked.add(key);
      storageSet(JOURNAL_LIKED_KEY, JSON.stringify(Array.from(journalLiked)));
      renderJournal();

      try {
        await db.collection('journal').doc(key).update({
          hearts: firebase.firestore.FieldValue.increment(wasLiked ? -1 : 1)
        });
      } catch (err) {
        console.error('heart error', err);
        // undo if saving failed
        if (wasLiked) journalLiked.add(key); else journalLiked.delete(key);
        storageSet(JOURNAL_LIKED_KEY, JSON.stringify(Array.from(journalLiked)));
        renderJournal();
      }
    }

    async function addJournalEntry() {
      const textInput = document.getElementById('journal-text');

      if (!journalAuthor) {
        alert('Please choose Kero or Tota first 💕');
        return;
      }
      if (!textInput.value.trim()) {
        alert('Please write something in the journal!');
        return;
      }

      const newEntry = {
        id: Date.now(),
        author: journalAuthor,
        text: textInput.value.trim(),
        mood: journalMood || '',
        hearts: 0,
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };

      try {
        await db.collection('journal').doc(newEntry.id.toString()).set(newEntry);
        textInput.value = '';
        journalMood = null;
        updateMoodButtons();
      } catch (err) {
        alert('Error posting journal note.');
      }
    }

    function openModalById(photoId) {
      const photo = photos.find(p => Number(p.id) === Number(photoId));
      if (!photo) return;

      showPhoto(photo, 0);

      document.getElementById('image-modal').classList.add('open');
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      document.getElementById('image-modal').classList.remove('open');
      document.body.classList.remove('modal-open');
      currentPhotoId = null;
    }

    // Used by the zoom button in the top bar: zoom in at the center / zoom back out
    function toggleZoom() {
      if (zScale > 1.01) {
        resetZoom(true);
      } else {
        const c = containerCenter();
        zoomAt(DOUBLE_TAP_SCALE, c.x, c.y, true);
      }
    }

    function renderPhotos() {
      const photosCarousel = document.getElementById('photos-carousel');
      document.getElementById('photo-counter').innerText = `${photos.length} memories`;

      if (photos.length === 0) {
        photosCarousel.innerHTML = `
          <div class="w-full text-center py-12 bg-white rounded-2xl border border-rose-100 p-6 flex-shrink-0">
            <p class="text-3xl mb-2">📸</p>
            <p class="text-xs font-semibold text-slate-500">No memories added yet</p>
            <p class="text-[11px] text-slate-400 mt-1">Upload your first photo above!</p>
          </div>
        `;
      } else {
        photosCarousel.innerHTML = photos.map((p, index) => {
          return `
            <div class="snap-center flex-shrink-0 photo-card bg-white rounded-2xl overflow-hidden border border-rose-100 shadow-sm flex flex-col">
              <div class="relative photo-card-img bg-slate-100 cursor-pointer group flex-shrink-0" onclick="openModalById(${Number(p.id)})">
                <img src="${p.imageData}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition flex items-center justify-center pointer-events-none">
                  <span class="bg-black/60 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-sm font-semibold">
                    <i class="fas fa-expand mr-1"></i> Tap to View & Zoom
                  </span>
                </div>
                <span class="absolute top-3 left-3 bg-black/60 text-white text-[10px] font-bold px-2 py-1 rounded-full backdrop-blur-sm pointer-events-none">
                  #${photos.length - index}
                </span>
              </div>
              <div class="p-4 space-y-2" style="min-width:0">
                <p class="text-xs text-slate-700 font-medium leading-relaxed safe-text caption-clamp">${escapeHtml(p.caption)}</p>
                <div class="flex justify-between items-center pt-1">
                  <span class="text-[10px] text-slate-400">${escapeHtml(p.date)}</span>
                  <button onclick="openModalById(${Number(p.id)})" class="text-[11px] text-rose-600 font-bold hover:underline py-1 px-1">Read Full Note</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function renderJournal() {
      const journalFeed = document.getElementById('journal-feed');

      if (journal.length === 0) {
        journalFeed.innerHTML = `
          <div class="text-center py-10 bg-white/80 rounded-3xl border border-rose-100 p-6">
            <p class="text-5xl mb-2">💖</p>
            <p class="font-cursive text-2xl text-rose-500">Write your first love note 💌</p>
          </div>
        `;
        journalFirstRender = false;
        return;
      }

      journalFeed.innerHTML = journal.map(j => {
        const kind = authorKind(j.author);
        const key = String(j.id);
        const isRight = kind === 'kero';
        const isNew = !journalFirstRender && !renderedJournalIds.has(key);
        const liked = journalLiked.has(key);
        const hearts = Math.max(0, Number(j.hearts) || 0);
        const icon = kind === 'kero' ? '🐻' : kind === 'tota' ? '🦜' : '💕';
        const nameColor = kind === 'kero' ? '#e11d48' : kind === 'tota' ? '#7c3aed' : '#c2410c';

        return `
          <div class="note-row ${isRight ? 'right' : ''}">
            <div class="note-bubble note-${kind} ${isNew ? 'note-pop' : ''}">
              <div class="flex items-center justify-between gap-3 mb-1">
                <span class="text-[11px] font-bold" style="color:${nameColor}">${icon} ${escapeHtml(j.author)}</span>
                ${j.mood ? `<span class="text-lg leading-none">${escapeHtml(j.mood)}</span>` : ''}
              </div>
              <p class="font-cursive text-xl leading-snug text-slate-700 safe-text">${escapeHtml(j.text)}</p>
              <div class="flex items-center justify-between gap-3 mt-2">
                <span class="text-[10px] text-slate-500">${escapeHtml(formatNoteTime(j.id, j.date))}</span>
                <button type="button" class="heart-btn ${liked ? 'liked' : ''}" onclick="toggleHeart(${Number(j.id)})" aria-label="Heart this note">
                  <span>${liked ? '❤️' : '🤍'}</span>${hearts > 0 ? `<span class="font-bold text-rose-500">${hearts}</span>` : ''}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      journal.forEach(j => renderedJournalIds.add(String(j.id)));
      journalFirstRender = false;
    }
  </script>
</body>
</html>
