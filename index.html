<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Kero & Tota ❤</title>

  <!-- Ask browsers not to keep an old copy of this page -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Apple PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kero & Tota">
  <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/heart-suit.png">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
            }
          },
          fontFamily: {
            cursive: ['"Dancing Script"', 'cursive'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    textarea { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ---------- Responsive / any-iPhone layout ---------- */
    html { -webkit-text-size-adjust: 100%; }
    html, body { overflow-x: hidden; }
    body { min-height: 100vh; min-height: 100dvh; }

    /* Keep content clear of the notch / Dynamic Island, rounded corners and the home bar */
    .app-header {
      padding-top: calc(0.75rem + env(safe-area-inset-top));
      padding-bottom: 0.75rem;
      padding-left: calc(1rem + env(safe-area-inset-left));
      padding-right: calc(1rem + env(safe-area-inset-right));
    }
    .app-main {
      padding-left: calc(1rem + env(safe-area-inset-left));
      padding-right: calc(1rem + env(safe-area-inset-right));
      padding-bottom: calc(6rem + env(safe-area-inset-bottom));
    }

    /* Photo cards scale with the screen: max 320px, but never wider than the phone allows */
    .photo-card { width: min(20rem, calc(100vw - 3rem - env(safe-area-inset-left) - env(safe-area-inset-right))); }

    /* Safe text wrapping for long text / emojis / long words */
    .safe-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* Card caption clamp (explicit CSS so it works on every iOS Safari version) */
    .caption-clamp {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .caption-clamp-1 {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow: hidden;
    }

    /* ---------- Polaroid cards ---------- */
    .polaroid {
      background: #fff;
      padding: 12px 12px 12px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(244,63,94,.14), 0 1px 3px rgba(0,0,0,.08);
      transform: rotate(var(--tilt, 0deg));
    }
    .polaroid-img {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f1f5f9;
      overflow: hidden;
      border-radius: 2px;
      cursor: pointer;
    }
    .polaroid-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .carousel-pad { padding: 16px 10px 22px; }

    .author-chip {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px;
      white-space: nowrap;
    }
    .mini-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      min-width: 36px; height: 36px; padding: 0 10px; border-radius: 9999px;
      background: #fff1f2; color: #e11d48; font-size: 13px; font-weight: 700; line-height: 1;
      transition: transform .15s ease;
    }
    .mini-btn:active { transform: scale(1.2); }
    .mini-btn.plain { background: transparent; color: #94a3b8; padding: 0; }

    .view-btn {
      padding: 7px 12px; border-radius: 10px; font-size: 11px; font-weight: 700;
      color: #64748b; transition: all .15s ease;
    }
    .view-btn.active { background: #fff; color: #e11d48; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    .dice-roll { animation: diceRoll .5s ease; }
    @keyframes diceRoll {
      from { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.25); }
      to   { transform: rotate(360deg) scale(1); }
    }

    /* ---------- Lightbox ---------- */
    #image-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100vh;              /* fallback */
      height: 100dvh;             /* iOS Safari: real visible height */
      z-index: 50;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      box-sizing: border-box;
    }
    #image-modal.open { display: flex; }

    #modal-image-container {
      flex: 1 1 auto;
      min-height: 0;              /* IMPORTANT: lets the flex child shrink instead of pushing content away */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
      touch-action: none;         /* we handle pinch / pan / swipe / double-tap ourselves */
    }
    #modal-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      transform-origin: center center;
      will-change: transform, opacity;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    #modal-caption-box {
      flex: 0 0 auto;
      max-height: 26vh;
      max-height: min(26dvh, 220px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .viewer-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 44px; min-width: 44px; padding: 0 16px; border-radius: 9999px;
      background: rgba(255,255,255,.2); color: #fff; font-size: 14px; font-weight: 600;
      transition: background .15s ease, transform .15s ease;
    }
    .viewer-btn:active { transform: scale(.94); background: rgba(255,255,255,.35); }

    .heart-burst {
      position: fixed; z-index: 5; font-size: 84px; line-height: 1; pointer-events: none;
      transform: translate(-50%, -50%) scale(0); opacity: 0;
      animation: heartBurst .85s ease forwards;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.4));
    }
    @keyframes heartBurst {
      0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0; }
      25%  { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
      45%  { transform: translate(-50%, -50%) scale(.95); opacity: 1; }
      75%  { transform: translate(-50%, -60%) scale(1);   opacity: 1; }
      100% { transform: translate(-50%, -90%) scale(1.1); opacity: 0; }
    }

    /* Prev / next arrows (only shown on devices with a mouse; phones use swipe) */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.35); }
    .nav-arrow.hidden-arrow { visibility: hidden; }
    #nav-prev { left: 12px; }
    #nav-next { right: 12px; }
    @media (hover: hover) and (pointer: fine) {
      .nav-arrow { display: flex; }
    }

    body.modal-open { overflow: hidden; }

    /* Short screens (iPhone SE / mini): give the photo more room */
    @media (max-height: 700px) {
      #modal-caption-box { max-height: 18dvh; }
    }
    /* Landscape phones: very little height, keep the photo as big as possible */
    @media (orientation: landscape) and (max-height: 500px) {
      #modal-caption-box { max-height: 22dvh; }
      #modal-image-container { margin: 2px 0; }
    }

    /* ---------- Bottom sheets (menu / edit / delete) + toast ---------- */
    #sheet-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 90;
      background: rgba(15,23,42,.45);
      display: none; align-items: flex-end; justify-content: center;
    }
    #sheet-overlay.open { display: flex; }
    #sheet-panel {
      width: 100%; max-width: 28rem; background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
      animation: sheetUp .25s ease;
    }
    @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet-btn {
      width: 100%; padding: 14px; border-radius: 16px; font-weight: 700; font-size: 15px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .sheet-btn:active { transform: scale(.98); }

    #toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 100;
      transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      background: rgba(30,30,40,.92); color: #fff; padding: 10px 16px; border-radius: 9999px;
      font-size: 13px; font-weight: 600; max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---------- "Who's here?" welcome screen ---------- */
    #who-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 120;
      background: linear-gradient(135deg, #fff1f2 0%, #fdf2f8 55%, #f5f3ff 100%);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    }
    #who-overlay.open { display: flex; }
    .who-big {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 22px; border-radius: 24px; background: #fff; border: 2px solid #fecdd3;
      font-size: 20px; font-weight: 700; color: #475569;
      box-shadow: 0 6px 18px rgba(244,63,94,.12);
      transition: transform .15s ease;
    }
    .who-big:active { transform: scale(.96); }
    .who-big.last { border-color: #f43f5e; background: #fff1f2; color: #e11d48; }
    .who-big .emoji { font-size: 36px; }

    /* ---------- Journal (cute chat-style notes) ---------- */
    .journal-hearts { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .journal-hearts span { position: absolute; bottom: -40px; opacity: 0; animation: floatHeart linear infinite; }
    @keyframes floatHeart {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: .35; }
      50%  { transform: translateY(-55vh) translateX(14px) rotate(10deg); }
      90%  { opacity: .25; }
      100% { transform: translateY(-115vh) translateX(-10px) rotate(-8deg); opacity: 0; }
    }

    .who-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px; border-radius: 16px; border: 2px solid #fecdd3;
      background: #fff; color: #64748b; font-weight: 700; font-size: 13px;
      transition: all .15s ease;
    }
    .who-btn:active { transform: scale(.96); }
    .who-btn.sel-kero { background: #f43f5e; border-color: #f43f5e; color: #fff; box-shadow: 0 4px 10px rgba(244,63,94,.3); }
    .who-btn.sel-tota { background: #a78bfa; border-color: #a78bfa; color: #fff; box-shadow: 0 4px 10px rgba(167,139,250,.35); }

    .mood-btn {
      width: 44px; height: 44px; border-radius: 9999px; background: #fff;
      border: 2px solid transparent; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s ease;
    }
    .mood-btn:active { transform: scale(.92); }
    .mood-btn.sel { border-color: #fb7185; background: #ffe4e6; transform: scale(1.12); }

    .note-row { display: flex; }
    .note-row.right { justify-content: flex-end; }
    .note-bubble {
      max-width: 86%; min-width: 0; padding: 12px 14px; border-radius: 22px;
      box-shadow: 0 2px 8px rgba(244,63,94,.08);
    }
    .note-kero  { background: linear-gradient(135deg, #ffe4e6, #fecdd3); border-bottom-right-radius: 6px; }
    .note-tota  { background: linear-gradient(135deg, #ede9fe, #ddd6fe); border-bottom-left-radius: 6px; }
    .note-other { background: linear-gradient(135deg, #ffedd5, #fed7aa); border-bottom-left-radius: 6px; }
    .note-pop { animation: notePop .4s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes notePop {
      from { opacity: 0; transform: scale(.85) translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .heart-btn {
      display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1;
      padding: 5px 9px; border-radius: 9999px; background: rgba(255,255,255,.7);
      transition: transform .15s ease, background .15s ease;
    }
    .heart-btn:active { transform: scale(1.3); }
    .heart-btn.liked { background: rgba(255,255,255,.95); }

    @media (prefers-reduced-motion: reduce) {
      .journal-hearts { display: none; }
      .note-pop { animation: none; }
    }
  </style>
</head>
<body class="bg-rose-50 text-slate-800 font-sans flex flex-col antialiased selection:bg-rose-200">

  <!-- Header -->
  <header class="app-header sticky top-0 z-40 bg-white border-b border-rose-100 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">💖</span>
        <h1 class="font-cursive text-2xl font-bold text-rose-600">Kero & Tota</h1>
      </div>
      <button id="who-chip" type="button" onclick="showWhoOverlay()" aria-label="Switch person"
              class="hidden items-center gap-1 bg-rose-50 border border-rose-100 text-rose-600 text-xs font-bold px-3 py-1.5 rounded-full active:scale-95 transition"></button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-main flex-1 max-w-md w-full mx-auto pt-4 space-y-6">

    <!-- Screen Switcher Tabs -->
    <div class="flex bg-white/70 p-1 rounded-xl border border-rose-100 shadow-sm">
      <button id="screen-photos-btn" onclick="switchScreen('photos')" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition text-rose-600 bg-white shadow-sm">
        <i class="fas fa-images mr-1"></i> Memories Gallery
      </button>
      <button id="screen-journal-btn" onclick="switchScreen('journal')" class="flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-rose-600">
        <i class="fas fa-book-heart mr-1"></i> Shared Journal
      </button>
    </div>

    <!-- SCREEN 1: MEMORIES / PHOTO GALLERY -->
    <section id="screen-photos" class="space-y-4">

      <!-- Upload Card -->
      <div class="rounded-3xl p-5 border border-rose-100 shadow-sm space-y-4"
           style="background: linear-gradient(135deg, #fff1f2 0%, #fdf2f8 55%, #f5f3ff 100%);">
        <div class="text-center">
          <h3 class="font-cursive text-3xl font-bold text-rose-600 leading-tight">Add a memory 📸</h3>
          <p class="text-[11px] text-slate-400 mt-0.5">Keep this moment forever</p>
        </div>

        <input type="file" id="photo-file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

        <!-- Preview Box (small polaroid) -->
        <div id="image-preview-container" class="hidden relative polaroid mx-auto" style="--tilt:-2deg; width: min(200px, 60%);">
          <div style="width:100%; aspect-ratio:1/1; overflow:hidden; border-radius:2px; background:#f1f5f9;">
            <img id="image-preview" src="" style="width:100%; height:100%; object-fit:cover; display:block;">
          </div>
          <button onclick="clearSelectedFile()" aria-label="Remove photo" class="absolute -top-3 -right-3 bg-rose-500 text-white rounded-full w-8 h-8 flex items-center justify-center text-xs shadow-md">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <button id="select-photo-btn" onclick="document.getElementById('photo-file-input').click()"
                class="w-full flex items-center justify-center gap-2 bg-white/70 border-2 border-dashed border-rose-300 hover:bg-rose-100/50 text-rose-600 py-4 rounded-2xl text-xs font-bold transition">
          <i class="fas fa-camera text-base"></i>
          <span>Choose Image</span>
        </button>

        <div class="space-y-1.5 hidden">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Who's adding it?</p>
          <div class="grid grid-cols-2 gap-2">
            <button id="up-who-kero" type="button" onclick="selectUploadAuthor('Kero')" class="who-btn"><span class="text-lg">🐻</span> Kero</button>
            <button id="up-who-tota" type="button" onclick="selectUploadAuthor('Tota')" class="who-btn"><span class="text-lg">🦜</span> Tota</button>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Notes</label>
          <!-- font-size 16px prevents iOS from auto-zooming the page when focusing the field -->
          <textarea id="photo-caption" rows="2" placeholder="Write a sweet note..."
                    style="font-size:16px"
                    class="w-full p-3 rounded-2xl border border-rose-100 focus:outline-none focus:border-rose-400 bg-white/80"></textarea>
        </div>

        <div id="upload-progress" class="hidden">
          <div class="h-2 rounded-full bg-rose-100 overflow-hidden">
            <div id="upload-progress-bar" class="h-full rounded-full" style="width:0%; background:linear-gradient(90deg,#fb7185,#a78bfa); transition:width .3s ease;"></div>
          </div>
          <p id="upload-progress-text" class="text-[11px] text-slate-500 text-center mt-1.5"></p>
        </div>

        <button id="upload-drive-btn" onclick="uploadMemory()" disabled class="w-full bg-rose-300 text-white font-semibold py-3 rounded-2xl text-sm shadow-sm transition flex items-center justify-center gap-2 cursor-not-allowed">
          <i class="fas fa-cloud-upload-alt"></i>
          <span id="upload-btn-text">Select an image first</span>
        </button>
      </div>

      <!-- Memories Timeline -->
      <div class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Our Memories Timeline</h3>
          <span id="photo-counter" class="text-[10px] text-rose-500 font-bold bg-rose-100 px-2 py-0.5 rounded-full">0 memories 💕</span>
        </div>

        <div class="flex items-center justify-between px-1">
          <div class="flex bg-white/70 p-0.5 rounded-xl border border-rose-100">
            <button id="view-carousel-btn" type="button" onclick="setPhotoView('carousel')" class="view-btn"><i class="fas fa-images mr-1"></i> Swipe</button>
            <button id="view-grid-btn" type="button" onclick="setPhotoView('grid')" class="view-btn"><i class="fas fa-th-large mr-1"></i> Grid</button>
          </div>
          <button id="surprise-btn" type="button" onclick="surpriseMe()" class="flex items-center gap-1.5 bg-white border border-rose-200 text-rose-600 text-[11px] font-bold px-3 py-2 rounded-full shadow-sm active:scale-95 transition">
            <span id="surprise-dice" class="text-base leading-none">🎲</span> Surprise me
          </button>
        </div>

        <div id="photos-container">
          <!-- Dynamically Populated -->
        </div>
      </div>
    </section>

    <!-- SCREEN 2: JOURNAL -->
    <section id="screen-journal" class="space-y-4 hidden">

      <!-- Compose card -->
      <div class="relative z-10 rounded-3xl p-5 border border-rose-100 shadow-sm space-y-4"
           style="background: linear-gradient(135deg, #fff1f2 0%, #fdf2f8 55%, #f5f3ff 100%);">
        <div class="text-center">
          <h3 class="font-cursive text-3xl font-bold text-rose-600 leading-tight">Dear love 💌</h3>
          <p class="text-[11px] text-slate-400 mt-0.5">Write something sweet for each other</p>
        </div>

        <div class="space-y-1.5 hidden">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Who's writing?</p>
          <div class="grid grid-cols-2 gap-2">
            <button id="who-kero" type="button" onclick="selectAuthor('Kero')" class="who-btn"><span class="text-lg">🐻</span> Kero</button>
            <button id="who-tota" type="button" onclick="selectAuthor('Tota')" class="who-btn"><span class="text-lg">🦜</span> Tota</button>
          </div>
        </div>

        <div class="space-y-1.5">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">How are you feeling?</p>
          <div class="flex justify-between">
            <button type="button" class="mood-btn" data-mood="😍" onclick="selectMood('😍')">😍</button>
            <button type="button" class="mood-btn" data-mood="🥰" onclick="selectMood('🥰')">🥰</button>
            <button type="button" class="mood-btn" data-mood="😴" onclick="selectMood('😴')">😴</button>
            <button type="button" class="mood-btn" data-mood="😢" onclick="selectMood('😢')">😢</button>
            <button type="button" class="mood-btn" data-mood="🤗" onclick="selectMood('🤗')">🤗</button>
          </div>
        </div>

        <textarea id="journal-text" rows="3" placeholder="Write thoughts or notes to each other..."
                  style="font-size:16px"
                  class="w-full p-3 rounded-2xl border border-rose-100 focus:outline-none focus:border-rose-400 bg-white/80"></textarea>

        <button onclick="addJournalEntry()" class="w-full bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-semibold py-3 rounded-2xl text-sm shadow-md transition">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBkZws6uuVSvWnqV0WgvliL1DC5HwKgk4E",
      authDomain: "keroandtota-f0393.firebaseapp.com",
      projectId: "keroandtota-f0393",
      storageBucket: "keroandtota-f0393.firebasestorage.app",
      messagingSenderId: "664802885467",
      appId: "1:664802885467:web:c48bf52856f63ccf18a47e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylOiP_Pnprl_PoDC4_KGDYJgeFnwMuEeXbhsK7oY7FLEVPyYorlHEqAB7bky0AZhsZ/exec';

    // Max size of the copy stored in Firestore (documents are limited to 1 MiB).
    const MAX_DIMENSION = 1280;
    const JPEG_QUALITY = 0.8;

    let selectedFileBase64 = null;   // original file, sent to Drive
    let selectedFileMime = null;
    let selectedFileName = null;
    let selectedCompressedDataUrl = null; // small copy, stored in Firestore
    let isZoomed = false;
    let isUploading = false;

    let photos = [];
    let journal = [];
    let currentPhotoId = null;       // id of the photo shown in the lightbox
    let sheetPhotoId = null;         // id of the photo the bottom sheet is about
    let lastSurpriseId = null;

    // ---------- Photo settings remembered on this phone ----------
    const PHOTO_LIKED_KEY = 'photoLikedMemories';
    const PHOTO_VIEW_KEY = 'photoView';
    const TILTS = [-2.2, 1.6, -1.1, 2.1, -1.7, 1.2];

    let photoLiked = new Set();      // ids of photos this phone has hearted
    try {
      const raw = localStorage.getItem(PHOTO_LIKED_KEY);
      if (raw) photoLiked = new Set(JSON.parse(raw).map(String));
    } catch (e) { photoLiked = new Set(); }

    let photoView = 'carousel';      // 'carousel' | 'grid'
    try {
      if (localStorage.getItem(PHOTO_VIEW_KEY) === 'grid') photoView = 'grid';
    } catch (e) {}

    // Escape user text before putting it into HTML (emojis are fine, but < > & " break the markup)
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Small message at the bottom of the screen
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    // "Today", "Yesterday" or "Oct 29, 2026"
    function formatPhotoDate(p) {
      const d = new Date(Number(p.id));
      if (isNaN(d.getTime())) return p.date || '';
      const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      const diffDays = Math.round((startOfDay(new Date()) - startOfDay(d)) / 86400000);
      if (diffDays === 0) return 'Today';
      if (diffDays === 1) return 'Yesterday';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function monthLabel(p) {
      const d = new Date(Number(p.id));
      if (isNaN(d.getTime())) return 'Earlier';
      return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function photoAuthorBadge(author) {
      if (author !== 'Kero' && author !== 'Tota') return '';
      const kero = author === 'Kero';
      return `<span class="author-chip" style="background:${kero ? '#ffe4e6' : '#ede9fe'}; color:${kero ? '#e11d48' : '#7c3aed'}">${kero ? '🐻' : '🦜'} ${author}</span>`;
    }

    // Shrink the image so the Firestore document stays well under the 1 MiB limit
    function compressImage(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          const scale = Math.min(1, MAX_DIMENSION / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    // ---------- Zoom state & gestures (pinch, pan, double-tap = heart, swipe, swipe down = close) ----------
    let zScale = 1, zX = 0, zY = 0;
    const MIN_SCALE = 1, MAX_SCALE = 5, DOUBLE_TAP_SCALE = 2.5;
    const SWIPE_THRESHOLD = 50;      // px a finger must travel horizontally to change photo
    const CLOSE_THRESHOLD = 110;     // px a finger must travel down to close the viewer

    const clampScale = (s) => Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));

    function applyTransform(animate) {
      const img = document.getElementById('modal-image');
      img.style.transition = animate ? 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)' : 'none';
      img.style.transform = `translate(${zX}px, ${zY}px) scale(${zScale})`;
      isZoomed = zScale > 1.01;
      document.getElementById('zoom-icon').className = isZoomed ? 'fas fa-search-minus' : 'fas fa-search-plus';
    }

    function clampPan() {
      const img = document.getElementById('modal-image');
      const cont = document.getElementById('modal-image-container');
      const maxX = Math.max(0, (img.offsetWidth * zScale - cont.clientWidth) / 2);
      const maxY = Math.max(0, (img.offsetHeight * zScale - cont.clientHeight) / 2);
      zX = Math.min(maxX, Math.max(-maxX, zX));
      zY = Math.min(maxY, Math.max(-maxY, zY));
    }

    function containerCenter() {
      const r = document.getElementById('modal-image-container').getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    // Zoom to newScale keeping the point (px, py) (screen coords) under the finger
    function zoomAt(newScale, px, py, animate) {
      const c = containerCenter();
      newScale = clampScale(newScale);
      const qx = (px - c.x - zX) / zScale;
      const qy = (py - c.y - zY) / zScale;
      zScale = newScale;
      zX = px - c.x - qx * newScale;
      zY = py - c.y - qy * newScale;
      if (zScale <= 1.001) { zScale = 1; zX = 0; zY = 0; }
      clampPan();
      applyTransform(animate);
    }

    function resetZoom(animate) {
      zScale = 1; zX = 0; zY = 0;
      const img = document.getElementById('modal-image');
      img.style.opacity = '1';
      applyTransform(animate);
    }

    function resetModalBg() {
      const modal = document.getElementById('image-modal');
      modal.style.transition = 'background 0.2s ease';
      modal.style.background = '';
    }

    // Big heart that pops up where you double-tapped
    function showHeartBurst(x, y) {
      const el = document.createElement('div');
      el.className = 'heart-burst';
      el.textContent = '❤️';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.getElementById('image-modal').appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function doubleTapHeart(x, y) {
      showHeartBurst(x, y);
      if (currentPhotoId != null) togglePhotoHeart(currentPhotoId, true); // double-tap only adds a heart
    }

    // ---------- Previous / next photo ----------
    function currentPhotoIndex() {
      return photos.findIndex(p => Number(p.id) === Number(currentPhotoId));
    }

    // direction: +1 = coming from the right (next), -1 = coming from the left (previous), 0 = no animation
    function showPhoto(photo, direction) {
      if (!photo) return;
      currentPhotoId = photo.id;

      const img = document.getElementById('modal-image');
      document.getElementById('modal-caption').textContent = photo.caption || '';
      document.getElementById('modal-date').textContent = formatPhotoDate(photo);
      img.src = photo.imageData;
      document.getElementById('modal-caption-box').scrollTo(0, 0);

      updateNavUi();
      updateViewerActions();

      zScale = 1; zX = 0; zY = 0;
      isZoomed = false;
      document.getElementById('zoom-icon').className = 'fas fa-search-plus';

      if (direction) {
        // start off to the side + transparent, then slide in
        img.style.transition = 'none';
        img.style.opacity = '0';
        img.style.transform = `translate(${direction * 60}px, 0px) scale(1)`;
        void img.offsetWidth; // force reflow so the starting state is applied
        img.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease';
        img.style.opacity = '1';
        img.style.transform = 'translate(0px, 0px) scale(1)';
      } else {
        img.style.transition = 'none';
        img.style.opacity = '1';
        img.style.transform = 'translate(0px, 0px) scale(1)';
      }
    }

    function updateNavUi() {
      const idx = currentPhotoIndex();
      const total = photos.length;
      document.getElementById('modal-counter').textContent = idx >= 0 ? `${idx + 1} / ${total}` : '';
      document.getElementById('nav-prev').classList.toggle('hidden-arrow', idx <= 0);
      document.getElementById('nav-next').classList.toggle('hidden-arrow', idx < 0 || idx >= total - 1);
    }

    // heart button + author badge in the viewer
    function updateViewerActions() {
      const p = photos[currentPhotoIndex()];
      if (!p) return;
      const liked = photoLiked.has(String(p.id));
      const h = Math.max(0, Number(p.hearts) || 0);
      document.getElementById('modal-heart-icon').textContent = liked ? '❤️' : '🤍';
      document.getElementById('modal-heart-count').textContent = h > 0 ? h : '';
      document.getElementById('modal-author').innerHTML = photoAuthorBadge(p.author);
    }

    // when the photo changed on the server while the viewer is open (caption edit, hearts)
    function refreshViewerInfo() {
      const p = photos[currentPhotoIndex()];
      if (!p) return;
      document.getElementById('modal-caption').textContent = p.caption || '';
      document.getElementById('modal-date').textContent = formatPhotoDate(p);
      updateViewerActions();
    }

    // step: +1 = next photo, -1 = previous photo. Returns true if the photo changed.
    function navigatePhoto(step) {
      const idx = currentPhotoIndex();
      if (idx < 0) return false;
      const target = idx + step;
      if (target < 0 || target >= photos.length) return false;
      showPhoto(photos[target], step);
      return true;
    }

    function setupZoomGestures() {
      const cont = document.getElementById('modal-image-container');
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-image');

      let mode = null;                 // 'pan' | 'pinch' | null
      let axis = null;                 // 'h' | 'v' | null (direction of a one-finger drag when not zoomed)
      let startDist = 0, startScale = 1, startX = 0, startY = 0, startMid = { x: 0, y: 0 };
      let panTouch = { x: 0, y: 0 }, panStartX = 0, panStartY = 0, moved = false;
      let lastTap = 0, lastTapPos = { x: 0, y: 0 };
      let gestureWasPinch = false;     // true if this gesture involved two fingers -> never a swipe

      const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

      function beginPan(t) {
        mode = 'pan';
        axis = null;
        panTouch = { x: t.clientX, y: t.clientY };
        panStartX = zX; panStartY = zY;
      }

      cont.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          mode = 'pinch';
          gestureWasPinch = true;
          startDist = dist(e.touches[0], e.touches[1]);
          startScale = zScale; startX = zX; startY = zY;
          startMid = mid(e.touches[0], e.touches[1]);
          moved = true; // a pinch is never a tap
        } else if (e.touches.length === 1) {
          gestureWasPinch = false;
          beginPan(e.touches[0]);
          moved = false;
        }
      }, { passive: false });

      cont.addEventListener('touchmove', (e) => {
        if (mode === 'pinch' && e.touches.length === 2) {
          e.preventDefault();
          const m = mid(e.touches[0], e.touches[1]);
          const ns = clampScale(startScale * dist(e.touches[0], e.touches[1]) / startDist);
          const c = containerCenter();
          const qx = (startMid.x - c.x - startX) / startScale;
          const qy = (startMid.y - c.y - startY) / startScale;
          zScale = ns;
          zX = m.x - c.x - qx * ns;
          zY = m.y - c.y - qy * ns;
          clampPan();
          applyTransform(false);
        } else if (mode === 'pan' && e.touches.length === 1) {
          e.preventDefault();
          const t = e.touches[0];
          const dx = t.clientX - panTouch.x;
          const dy = t.clientY - panTouch.y;
          if (Math.hypot(dx, dy) > 8) moved = true;
          if (zScale > 1.01) {
            // zoomed in: move the image around
            zX = panStartX + dx;
            zY = panStartY + dy;
            clampPan();
            applyTransform(false);
          } else if (!gestureWasPinch && moved) {
            // not zoomed: decide once whether this is a sideways swipe or a swipe down
            if (!axis) axis = Math.abs(dy) > Math.abs(dx) ? 'v' : 'h';
            modalImg.style.transition = 'none';
            if (axis === 'v') {
              // image follows the finger, background fades, image shrinks a little (like iPhone Photos)
              const down = Math.max(0, dy);
              const p = Math.min(1, down / 300);
              modalImg.style.transform = `translate(${dx * 0.5}px, ${dy}px) scale(${1 - p * 0.25})`;
              modal.style.transition = 'none';
              modal.style.background = `rgba(0,0,0,${0.95 * (1 - p)})`;
            } else {
              // image follows the finger horizontally (swipe preview)
              modalImg.style.transform = `translate(${dx * 0.6}px, 0px) scale(1)`;
            }
          }
        }
      }, { passive: false });

      cont.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
          const t = e.changedTouches[0];
          let swiped = false;
          let closing = false;

          if (mode === 'pan' && !moved) {
            const now = Date.now();
            if (now - lastTap < 300 && Math.hypot(t.clientX - lastTapPos.x, t.clientY - lastTapPos.y) < 40) {
              // DOUBLE TAP -> heart
              e.preventDefault();
              lastTap = 0;
              doubleTapHeart(t.clientX, t.clientY);
            } else {
              lastTap = now;
              lastTapPos = { x: t.clientX, y: t.clientY };
            }
          } else if (mode === 'pan' && moved && zScale <= 1.01 && !gestureWasPinch) {
            const dx = t.clientX - panTouch.x;
            const dy = t.clientY - panTouch.y;
            if (axis === 'v') {
              // SWIPE DOWN to close
              if (dy > CLOSE_THRESHOLD) { closing = true; closeModal(); }
            } else if (axis === 'h') {
              // SWIPE LEFT / RIGHT to change photo
              if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5) {
                swiped = navigatePhoto(dx < 0 ? 1 : -1); // swipe left -> next, swipe right -> previous
              }
            }
          }

          if (!closing) {
            if (!swiped && zScale < 1.01) resetZoom(true); // snap back if no photo change happened
            resetModalBg();
          }
          mode = null;
          axis = null;
        } else if (e.touches.length === 1) {
          // one finger lifted after a pinch -> continue as pan with the remaining finger
          beginPan(e.touches[0]);
          moved = true;
        }
      }, { passive: false });

      cont.addEventListener('touchcancel', () => {
        mode = null;
        axis = null;
        if (zScale < 1.01) resetZoom(true);
        resetModalBg();
      });

      // Stop iOS Safari from zooming the whole page while the lightbox is open
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
        modal.addEventListener(ev, (e) => e.preventDefault())
      );

      // Desktop: double-click = heart, mouse wheel = zoom
      cont.addEventListener('dblclick', (e) => {
        doubleTapHeart(e.clientX, e.clientY);
      });
      cont.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomAt(zScale * (e.deltaY < 0 ? 1.15 : 0.87), e.clientX, e.clientY, false);
      }, { passive: false });

      window.addEventListener('resize', () => resetZoom(false));
    }

    document.addEventListener('DOMContentLoaded', () => {
      setupZoomGestures();
      document.getElementById('modal-image').setAttribute('draggable', 'false');

      document.addEventListener('keydown', (e) => {
        const open = document.getElementById('image-modal').classList.contains('open');
        if (e.key === 'Escape') { closeSheet(); closeModal(); }
        else if (open && e.key === 'ArrowRight') navigatePhoto(1);
        else if (open && e.key === 'ArrowLeft') navigatePhoto(-1);
      });
    });

    db.collection('photos').orderBy('id', 'desc').onSnapshot(snapshot => {
      photos = snapshot.docs.map(doc => doc.data());
      renderPhotos();
      // keep the viewer correct if photos change while it is open
      if (document.getElementById('image-modal').classList.contains('open')) {
        if (currentPhotoIndex() < 0) {
          closeModal(); // this memory was deleted
        } else {
          updateNavUi();
          refreshViewerInfo();
        }
      }
    }, err => console.error('photos listener error', err));

    db.collection('journal').orderBy('id', 'desc').onSnapshot(snapshot => {
      journal = snapshot.docs.map(doc => doc.data());
      renderJournal();
    }, err => console.error('journal listener error', err));

    function switchScreen(screen) {
      document.getElementById('screen-photos').classList.toggle('hidden', screen !== 'photos');
      document.getElementById('screen-journal').classList.toggle('hidden', screen !== 'journal');

      document.getElementById('screen-photos-btn').className = screen === 'photos'
        ? 'flex-1 py-2.5 rounded-lg text-xs font-bold transition text-rose-600 bg-white shadow-sm'
        : 'flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-rose-600';

      document.getElementById('screen-journal-btn').className = screen === 'journal'
        ? 'flex-1 py-2.5 rounded-lg text-xs font-bold transition text-rose-600 bg-white shadow-sm'
        : 'flex-1 py-2.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-rose-600';

      if (screen === 'photos') updateUploadAuthorButtons(); // keep "who's adding it" in sync with the journal
    }

    // ---------- Upload ----------

    async function uploadMemory() {
      const caption = document.getElementById('photo-caption').value.trim();
      if (!selectedFileBase64 || !selectedCompressedDataUrl || isUploading) return;

      let author = null;
      try { author = (typeof journalAuthor !== 'undefined') ? journalAuthor : null; } catch (e) { author = null; }
      if (!author) author = storageGet('journalAuthor');
      if (author !== 'Kero' && author !== 'Tota') {
        showToast('Please choose Kero or Tota first 💕');
        return;
      }

      isUploading = true;
      const uploadBtn = document.getElementById('upload-drive-btn');
      const btnText = document.getElementById('upload-btn-text');
      uploadBtn.disabled = true;
      uploadBtn.className = "w-full bg-rose-300 text-white font-semibold py-3 rounded-2xl text-sm shadow-sm transition flex items-center justify-center gap-2 cursor-not-allowed";
      btnText.innerText = "Uploading...";

      // slowly creeping bar while the photo travels to Drive
      let pct = 6;
      setProgress(pct, 'Sending your photo… 📤');
      const creep = setInterval(() => {
        pct += (62 - pct) * 0.08;
        document.getElementById('upload-progress-bar').style.width = pct + '%';
      }, 300);

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: selectedFileBase64,
            mimeType: selectedFileMime,
            filename: selectedFileName,
            caption: caption || 'Our memory'
          })
        });
        clearInterval(creep);
        setProgress(80, 'Adding it to your album… 💕');

        const newPhoto = {
          id: Date.now(),
          imageData: selectedCompressedDataUrl,
          caption: caption || 'Our memory ❤',
          author: author,
          hearts: 0,
          date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        };

        await db.collection('photos').doc(newPhoto.id.toString()).set(newPhoto);

        setProgress(100, 'Saved! 🎉');
        document.getElementById('photo-caption').value = '';
        clearSelectedFile();
        showToast('Memory added 💕');
        setTimeout(() => document.getElementById('upload-progress').classList.add('hidden'), 900);
      } catch (err) {
        clearInterval(creep);
        console.error(err);
        document.getElementById('upload-progress').classList.add('hidden');
        showToast('Error uploading. Please check your internet connection.');
        setUploadButtonReady();
      }
      isUploading = false;
    }

    // "Today · 1:19 AM", "Yesterday · 9:40 PM", or "Oct 29, 2026 · 6:05 PM"
    function formatNoteTime(id, fallbackDate) {
      const d = new Date(Number(id));
      if (isNaN(d.getTime())) return fallbackDate || '';
      const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      const diffDays = Math.round((startOfDay(new Date()) - startOfDay(d)) / 86400000);
      if (diffDays === 0) return 'Today · ' + time;
      if (diffDays === 1) return 'Yesterday · ' + time;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + time;
    }

    async function toggleHeart(id) {
      const key = String(id);
      const wasLiked = journalLiked.has(key);

      // update the screen right away
      if (wasLiked) journalLiked.delete(key); else journalLiked.add(key);
      storageSet(JOURNAL_LIKED_KEY, JSON.stringify(Array.from(journalLiked)));
      renderJournal();

      try {
        await db.collection('journal').doc(key).update({
          hearts: firebase.firestore.FieldValue.increment(wasLiked ? -1 : 1)
        });
      } catch (err) {
        console.error('heart error', err);
        // undo if saving failed
        if (wasLiked) journalLiked.add(key); else journalLiked.delete(key);
        storageSet(JOURNAL_LIKED_KEY, JSON.stringify(Array.from(journalLiked)));
        renderJournal();
      }
    }

    // ---------- Save / share ----------
    function dataUrlToFile(dataUrl, name) {
      const parts = dataUrl.split(',');
      const mimeMatch = parts[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
      const bin = atob(parts[1]);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new File([arr], name, { type: mime });
    }

    function downloadPhoto(p) {
      const a = document.createElement('a');
      a.href = p.imageData;
      a.download = `kero-tota-${p.id}.jpg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function sharePhoto() {
      const p = photos[currentPhotoIndex()];
      if (!p) return;
      try {
        // convert synchronously so iOS still counts this as a tap
        const file = dataUrlToFile(p.imageData, `kero-tota-${p.id}.jpg`);
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else {
          downloadPhoto(p);
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return; // closed the share sheet
        console.error('share error', err);
        downloadPhoto(p);
      }
    }

        container.className = 'grid grid-cols-2 gap-3 pb-2';
        let html = '';
        let lastLabel = null;
        photos.forEach(p => {
          const label = monthLabel(p);
          if (label !== lastLabel) {
            const count = photos.filter(x => monthLabel(x) === label).length;
            html += `<div class="col-span-2 font-cursive text-2xl text-rose-500 pt-2 px-1">${escapeHtml(label)} <span class="font-sans text-[11px] text-slate-400 font-semibold">· ${count}</span></div>`;

          html += gridTileHtml(p);

      } else {
        const keepScroll = container.scrollLeft;
        container.className = 'flex overflow-x-auto gap-4 snap-x snap-mandatory no-scrollbar carousel-pad';
        container.innerHTML = photos.map((p, index) => carouselCardHtml(p, index)).join('');

      }
    }

    function renderJournal() {
      const journalFeed = document.getElementById('journal-feed');

      if (journal.length === 0) {
        journalFeed.innerHTML = `
          <div class="text-center py-10 bg-white/80 rounded-3xl border border-rose-100 p-6">
            <p class="text-5xl mb-2">💖</p>
            <p class="font-cursive text-2xl text-rose-500">Write your first love note 💌</p>
          </div>
        `;
        journalFirstRender = false;
        return;
      }

      journalFeed.innerHTML = journal.map(j => {
        const kind = authorKind(j.author);
        const key = String(j.id);
        const isRight = kind === 'kero';
        const isNew = !journalFirstRender && !renderedJournalIds.has(key);
        const liked = journalLiked.has(key);
        const hearts = Math.max(0, Number(j.hearts) || 0);
        const icon = kind === 'kero' ? '🐻' : kind === 'tota' ? '🦜' : '💕';
        const nameColor = kind === 'kero' ? '#e11d48' : kind === 'tota' ? '#7c3aed' : '#c2410c';

        return `
          <div class="note-row ${isRight ? 'right' : ''}">
            <div class="note-bubble note-${kind} ${isNew ? 'note-pop' : ''}">
              <div class="flex items-center justify-between gap-3 mb-1">
                <span class="text-[11px] font-bold" style="color:${nameColor}">${icon} ${escapeHtml(j.author)}</span>
                ${j.mood ? `<span class="text-lg leading-none">${escapeHtml(j.mood)}</span>` : ''}
              </div>
              <p class="font-sans text-[15px] font-medium leading-relaxed text-slate-700 safe-text">${escapeHtml(j.text)}</p>
              <div class="flex items-center justify-between gap-3 mt-2">
                <span class="text-[10px] text-slate-500">${escapeHtml(formatNoteTime(j.id, j.date))}</span>
                <div class="flex items-center gap-1">
                  <button type="button" class="heart-btn ${liked ? 'liked' : ''}" onclick="toggleHeart(${Number(j.id)})" aria-label="Heart this note">
                    <span>${liked ? '❤️' : '🤍'}</span>${hearts > 0 ? `<span class="font-bold text-rose-500">${hearts}</span>` : ''}
                  </button>
                  <button type="button" class="heart-btn" style="min-width:30px; justify-content:center; color:#64748b" onclick="openNoteMenu(${Number(j.id)})" aria-label="More options"><i class="fas fa-ellipsis"></i></button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      journal.forEach(j => renderedJournalIds.add(String(j.id)));
      journalFirstRender = false;
    }

    // ---------- Who's using the app (chosen once, used by journal + gallery) ----------
    function currentUser() {
      return (journalAuthor === 'Kero' || journalAuthor === 'Tota') ? journalAuthor : null;
    }

    function updateHeaderUser() {
      const chip = document.getElementById('who-chip');
      const u = currentUser();
      if (!u) { chip.classList.add('hidden'); chip.classList.remove('flex'); return; }
      chip.classList.remove('hidden');
      chip.classList.add('flex');
      chip.innerHTML = `<span class="text-base leading-none">${u === 'Kero' ? '🐻' : '🦜'}</span> ${u} <span class="text-[10px] font-semibold text-rose-400">· switch</span>`;
    }

    function showWhoOverlay(atLaunch) {
      // no Cancel when the app just opened: you pick who you are first
      document.getElementById('who-cancel').classList.toggle('hidden', !!atLaunch || !currentUser());
      // highlight the person who used this phone last
      document.querySelectorAll('.who-big').forEach(b => b.classList.toggle('last', b.dataset.who === currentUser()));
      document.getElementById('who-overlay').classList.add('open');
    }

    function hideWhoOverlay() {
      document.getElementById('who-overlay').classList.remove('open');
    }

    function chooseUser(name) {
      journalAuthor = name;
      storageSet(JOURNAL_AUTHOR_KEY, name);
      updateAuthorButtons();
      updateUploadAuthorButtons();
      updateHeaderUser();
      hideWhoOverlay();
    }

    // Photos screen start-up (registered last so the journal has already loaded the remembered name)
    document.addEventListener('DOMContentLoaded', () => {
      updateUploadAuthorButtons();
      renderPhotos();
      updateHeaderUser();
      showWhoOverlay(true); // the choose screen is always the first thing you see
    });
  </script>
</body>
</html>
